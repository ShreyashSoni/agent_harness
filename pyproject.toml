[project]
name = "agent-harness"
version = "0.1.0"
description = "A from-scratch AI Agent Harness"
readme = "README.md"
requires-python = ">=3.14.10"
dependencies = [
    "chromadb>=1.5.9",
    "docker>=7.2.0",
    "langsmith>=0.16.2",
    "openai>=3.46.0",
    "pydantic",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
